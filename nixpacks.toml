[variables]
NPM_CONFIG_PRODUCTION = "false"
NODE_ENV = "development"

[phases.setup]
nixPkgs = ["python3", "gcc"]

[phases.install]
cmds = ["npm install --no-audit --no-fund"]

[phases.build]
cmds = ["NODE_ENV=production NODE_OPTIONS='--max-old-space-size=4096' npm run build"]

[start]
cmd = "node dist/index.js"
