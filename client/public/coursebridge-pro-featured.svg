    <text x="349" y="211" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">LearnPress</text>

    <rect x="153" y="273" width="128" height="98" rx="23" fill="#211b56" stroke="url(#accent)" stroke-width="3"/>
    <path d="M189 326l18 18 38-43" fill="none" stroke="#62e4d2" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="217" y="396" fill="#dfe4ff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">AUTO-ENROLL</text>
    <path d="M217 236v37" stroke="#a9b4ff" stroke-width="5" stroke-linecap="round" stroke-dasharray="7 9"/>
